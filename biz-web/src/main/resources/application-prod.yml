spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ENC(生产环境密文)
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:app}
    password: ENC(生产环境密文)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

springdoc:
  enabled: false
