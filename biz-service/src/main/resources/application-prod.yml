spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/biz_db?characterEncoding=utf8&useSSL=true&serverTimezone=UTC
    username: ${DB_USER:app}
    password: ENC(生产环境密文)
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ENC(生产环境密文)
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:app}
    password: ENC(生产环境密文)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
