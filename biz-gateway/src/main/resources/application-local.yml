# Local profile: Nacos disabled, explicit URI routing
# Usage: --spring.profiles.active=local
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: biz-web
          uri: http://127.0.0.1:8080
          predicates:
            - Path=/api/**

# CORS for local development (allow localhost)
gateway:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
