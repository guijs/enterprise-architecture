spring:
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

springdoc:
  enabled: true

# 开发环境：使用固定的内部 token 方便调试（生产必须通过 INTERNAL_TOKEN 环境变量配置）
security:
  internal:
    token: local-internal-token-for-dev
