apiVersion: apps/v1
kind: Deployment
metadata:
  name: biz-service
  labels:
    app: biz-service
    tier: service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: biz-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: biz-service
        tier: service
    spec:
      containers:
        - name: biz-service
          image: registry.company.com/biz-service:1.0.0
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JASYPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biz-secret
                  key: jasypt
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: biz-secret
                  key: internal-token
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: biz-service
  labels:
    app: biz-service
spec:
  type: ClusterIP
  selector:
    app: biz-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
